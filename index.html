<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183e32">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Slaptas Kalėdų Senelis</title>
  <style>
    :root{color-scheme:light;--green:#183e32;--red:#ac3940;--gold:#a77b32;--ink:#283c32;--muted:#6d786e;--line:#dce4da;--name-size:42px;--name-cap:42px;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink);background:#fafcf8}
    *{box-sizing:border-box}body{margin:0;min-width:280px;background:repeating-linear-gradient(90deg,transparent 0,transparent 79px,#e7ede43b 79px,#e7ede43b 80px)}button{font:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:5px}[hidden]{display:none!important}.page{min-height:100svh;display:flex;flex-direction:column;overflow:hidden}.masthead{width:min(1040px,100%);margin:0 auto;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}.wordmark{font:600 19px/1.3 'Palatino Linotype','Book Antiqua',Georgia,serif;color:var(--green)}.edition{font-size:10px;color:var(--muted);white-space:nowrap}.demo-label{color:var(--red);font-size:10px;margin-left:10px}main{flex:1;display:grid;align-content:center;justify-items:center;padding:36px 24px 26px;position:relative}.intro{text-align:center;max-width:600px;position:relative;z-index:1}.eyebrow{font-size:10px;font-weight:700;color:var(--red);margin:0 0 15px}h1{font:500 42px/1.15 'Palatino Linotype','Book Antiqua',Georgia,serif;color:var(--green);margin:0;text-wrap:balance}.intro-copy{font-size:13px;line-height:1.7;color:var(--muted);margin:14px 0 0}.experience{width:min(470px,100%);text-align:center;position:relative}.scene{position:relative;width:100%;height:var(--scene-height,340px);margin:27px 0 7px;isolation:isolate;transition:height .6s ease}.envelope-back{position:absolute;inset:30px 0 35px;background:#21513e;border:1px solid #163b2b;border-radius:4px;box-shadow:0 20px 35px #173a2914}.letter{position:absolute;top:44px;left:18px;width:calc(100% - 36px);background:#fff;box-shadow:0 12px 30px #173a2918;border:1px solid #e1e6dc;border-radius:3px;overflow:hidden;opacity:0;transform:translateY(40px) scale(.96);transition:transform .75s cubic-bezier(.16,1,.3,1),opacity .4s ease;z-index:2}.photo-band{display:block;width:100%;height:106px;object-fit:cover;object-position:center 45%;border-bottom:1px solid #e8e9df}.letter-body{padding:24px 20px 26px}.letter-label{font-size:10px;color:var(--red);font-weight:700;margin:0 0 17px}.recipient-name{font:500 min(var(--name-size),var(--name-cap))/1.18 'Palatino Linotype','Book Antiqua',Georgia,serif;color:var(--green);overflow-wrap:anywhere;margin:0;min-height:50px;text-wrap:balance}.letter-divider{width:42px;height:1px;background:#ceb681;margin:21px auto 16px}.letter-wish{font:italic 17px/1.5 'Palatino Linotype','Book Antiqua',Georgia,serif;color:#667563;margin:0}.envelope-photo{position:absolute;inset:30px 0 auto;height:110px;width:100%;object-fit:cover;object-position:center 45%;border-radius:4px 4px 0 0;z-index:1;filter:saturate(.8)}.envelope-front{position:absolute;inset:106px 0 35px;background:linear-gradient(145deg,#2c6049,#204b39);clip-path:polygon(0 0,50% 34%,100% 0,100% 100%,0 100%);border-radius:0 0 4px 4px;z-index:4;transition:transform .65s ease,opacity .45s ease}.envelope-flap{position:absolute;top:30px;left:0;width:100%;height:175px;background:#32654d;clip-path:polygon(0 0,100% 0,50% 100%);z-index:5;transform-origin:top center;transition:transform .6s ease,opacity .45s ease}.envelope-edge{position:absolute;inset:30px 0 35px;z-index:5;border:1px solid #a6bb9d44;border-radius:4px;pointer-events:none;transition:opacity .4s ease}.seal{position:absolute;top:165px;left:calc(50% - 27px);width:54px;height:54px;display:grid;place-items:center;background:var(--red);color:#fff3dd;border:4px double #d5928270;border-radius:50%;box-shadow:0 3px 6px #0002;z-index:6;font-size:23px;transition:transform .55s ease,opacity .35s ease}.envelope-caption{position:absolute;bottom:67px;left:16px;right:16px;z-index:6;font:italic 19px 'Palatino Linotype','Book Antiqua',Georgia,serif;color:#e4e9d4;transition:opacity .3s ease}.open-button{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:190px;min-height:48px;padding:13px 24px;border:1px solid var(--green);border-radius:4px;background:var(--green);color:white;font-size:13px;font-weight:700;transition:background .15s ease}.open-button:hover{background:#2b5b43}.button-star{font-size:17px;color:#e2c482}.secret-note{font-size:11px;color:var(--muted);margin:15px 0 0;min-height:18px}.is-open .letter{opacity:1;transform:translateY(-28px) scale(1);transition-delay:.18s}.is-open .envelope-flap{transform:translateY(-65px) rotate(-5deg);opacity:0}.is-open .envelope-front{transform:translateY(70px);opacity:0}.is-open .seal{transform:translateY(28px) rotate(25deg);opacity:0}.is-open .envelope-edge,.is-open .envelope-caption,.is-open .envelope-photo,.is-open .envelope-back{opacity:0}.envelope-back,.envelope-photo{transition:opacity .5s ease}.is-open .open-button{background:transparent;color:var(--green);border-color:#b9c9b8}.is-open .button-star{color:var(--gold)}.footer{width:min(1040px,calc(100% - 48px));margin:12px auto 0;padding:20px 0 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted)}.footer-wish{font:italic 15px 'Palatino Linotype','Book Antiqua',Georgia,serif;color:var(--green)}.message-state{width:min(470px,100%);text-align:center;padding:60px 10px 80px}.message-star{display:block;color:var(--gold);font-size:40px;margin-bottom:24px}.message-state h1{font-size:34px}.message-state p{font-size:13px;line-height:1.8;color:var(--muted);max-width:340px;margin:17px auto 0}.confetti{position:fixed;left:50%;top:48%;width:7px;height:12px;pointer-events:none;z-index:10;animation:confetti-flight 1.4s cubic-bezier(.12,.6,.35,1) forwards;background:var(--piece-color)}@keyframes confetti-flight{0%{opacity:0;transform:translate(0,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--piece-x),var(--piece-y)) rotate(var(--piece-turn))}}@media(max-width:540px){:root{--name-cap:34px}.masthead{padding:22px 22px}.wordmark{font-size:17px}.edition{font-size:9px}main{padding:32px 22px 26px;align-content:start}h1{font-size:34px}.intro-copy{font-size:12px;max-width:270px;margin:12px auto 0}.scene{margin-top:22px;height:var(--scene-height,315px)}.envelope-back,.envelope-edge{bottom:30px}.envelope-front{bottom:30px}.envelope-flap{height:150px}.seal{top:147px}.envelope-caption{font-size:18px;bottom:59px}.letter{left:12px;width:calc(100% - 24px)}.letter-body{padding:22px 14px}.photo-band{height:90px}.letter-wish{font-size:16px}.footer{padding-bottom:22px;font-size:9px;align-items:center}.footer-wish{font-size:14px}.message-state{padding:48px 0 65px}.message-state h1{font-size:30px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    .scene{pointer-events:none}.letter[aria-hidden="true"]{visibility:hidden}
    @media(max-width:540px){.masthead{align-items:flex-start}.wordmark{flex:1;min-width:0}.edition{flex:0 1 110px;white-space:normal;text-align:right;line-height:1.6}.demo-label{display:block;margin:4px 0 0}}
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead"><span class="wordmark">Slaptas Kalėdų Senelis<span id="demo-label" class="demo-label" hidden>Peržiūra</span></span><span class="edition">Mažos staigmenos, didelis džiaugsmas.</span></header>
    <main>
      <div id="intro" class="intro" hidden><h1 id="page-heading">Tavo Kalėdų paslaptis</h1><p id="intro-copy" class="intro-copy">Vienas vardas. Viena apgalvota dovana.</p></div>
      <section id="experience" class="experience" aria-label="Kalėdinis laiškas" hidden>
        <div id="scene" class="scene">
          <div class="envelope-back" aria-hidden="true"></div>
          <img class="envelope-photo" src="gifts.jpg" width="800" height="550" alt="" aria-hidden="true">
          <article id="letter" class="letter" aria-hidden="true">
            <img class="photo-band" src="gifts.jpg" width="800" height="550" alt="Šventiškai supakuotos dovanos">
            <div class="letter-body"><p class="letter-label">TAVO DOVANA SKIRTA</p><h2 id="recipient-name" class="recipient-name"></h2><div class="letter-divider" aria-hidden="true"></div><p class="letter-wish">Apgalvota dovana. Maža staigmena.<br>Daug šilumos.</p></div>
          </article>
          <div class="envelope-front" aria-hidden="true"></div><div class="envelope-flap" aria-hidden="true"></div><div class="envelope-edge" aria-hidden="true"></div>
          <span class="seal" aria-hidden="true">&#10022;</span><span class="envelope-caption" aria-hidden="true">Tik tau.</span>
        </div>
        <button id="reveal-button" class="open-button" type="button" aria-expanded="false" aria-controls="letter"><span class="button-star" aria-hidden="true">&#10022;</span><span id="button-label">Atskleisti</span></button>
        <p id="secret-note" class="secret-note">Tegul tai lieka maža paslaptis.</p>
        <p id="announcement" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap"></p>
      </section>
      <section id="message-state" class="message-state" hidden><span class="message-star" aria-hidden="true">&#10022;</span><h1 id="message-heading"></h1><p id="message-copy"></p></section>
      <noscript><section class="message-state"><h1>Paslaptis dar užverta.</h1><p>Šiam laiškui atverti naršyklėje turi būti įjungtas JavaScript.</p></section></noscript>
    </main>
    <footer class="footer"><span>Viena dovana. Daug šypsenų.</span><span class="footer-wish">Jaukių švenčių!</span></footer>
  </div>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let recipientName = '';
    let isOpen = false;

    function decodeName(hash) {
      const fragment = hash.replace(/^#/, '');
      if (!fragment) return '';
      const encoded = fragment.startsWith('name=') ? new URLSearchParams(fragment).get('name').replace(/ /g, '+') : decodeURIComponent(fragment);
      if (!encoded || encoded.length > 4096 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) throw new Error('Invalid code');
      const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
      const name = new TextDecoder('utf-8', { fatal: true }).decode(bytes).trim();
      if (!name || Array.from(name).length > 200 || /[\u0000-\u001f\u007f]/.test(name)) throw new Error('Invalid name');
      return name;
    }

    function resizeLetter() {
      if (!isOpen) return;
      byId('scene').style.setProperty('--scene-height', `${Math.max(340, byId('letter').offsetHeight + 45)}px`);
    }

    function celebrate() {
      if (reducedMotion.matches) return;
      const colors = ['#ac3940', '#a77b32', '#32654d', '#d2b571'];
      for (let index = 0; index < 24; index++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.setAttribute('aria-hidden', 'true');
        piece.style.setProperty('--piece-color', colors[index % colors.length]);
        piece.style.setProperty('--piece-x', `${Math.cos(index * 2.4) * (90 + index * 6)}px`);
        piece.style.setProperty('--piece-y', `${Math.sin(index * 2.4) * 120 + 130}px`);
        piece.style.setProperty('--piece-turn', `${index * 47}deg`);
        piece.addEventListener('animationend', () => piece.remove(), { once: true });
        document.body.append(piece);
      }
    }

    function setOpen(open) {
      isOpen = open;
      byId('recipient-name').textContent = open ? recipientName : '';
      byId('letter').setAttribute('aria-hidden', String(!open));
      byId('reveal-button').setAttribute('aria-expanded', String(open));
      byId('button-label').textContent = open ? 'Paslėpti vardą' : 'Atskleisti';
      byId('page-heading').textContent = open ? 'Šiek tiek Kalėdų magijos.' : 'Tavo Kalėdų paslaptis';
      byId('intro-copy').textContent = open ? 'Dabar prasideda gražiausia dalis.' : 'Vienas vardas. Viena apgalvota dovana.';
      byId('secret-note').textContent = open ? 'Kas dovanoja, tegul lieka paslaptis.' : 'Tegul tai lieka maža paslaptis.';
      byId('announcement').textContent = open ? `Tavo dovana skirta: ${recipientName}` : '';
      byId('experience').classList.toggle('is-open', open);
      if (open) { resizeLetter(); celebrate(); }
      else { byId('scene').style.removeProperty('--scene-height'); document.querySelectorAll('.confetti').forEach(piece => piece.remove()); }
    }

    function loadInvitation() {
      setOpen(false);
      byId('intro').hidden = true;
      byId('experience').hidden = true;
      byId('message-state').hidden = true;
      const demo = !location.hash && new URLSearchParams(location.search).get('demo') === '1';
      byId('demo-label').hidden = !demo;
      recipientName = '';
      try {
        recipientName = demo ? 'Austėja' : decodeName(location.hash);
        if (!recipientName) {
          byId('message-heading').textContent = 'Ši paslaptis laukia savo laiško.';
          byId('message-copy').textContent = 'Atverk asmeninę nuorodą iš gauto kvietimo. Tavo Kalėdų staigmena lauks ten.';
          byId('message-state').hidden = false;
          return;
        }
        const nameLength = Array.from(recipientName).length;
        document.documentElement.style.setProperty('--name-size', nameLength > 50 ? '26px' : nameLength > 24 ? '32px' : '42px');
        byId('intro').hidden = false;
        byId('experience').hidden = false;
      } catch {
        byId('message-heading').textContent = 'Šis kvietimas neatpažintas.';
        byId('message-copy').textContent = 'Nuoroda gali būti nepilna. Paprašyk organizatoriaus naujos nuorodos ir sugrįžk į savo Kalėdų paslaptį.';
        byId('message-state').hidden = false;
      }
    }

    byId('reveal-button').addEventListener('click', () => setOpen(!isOpen));
    addEventListener('hashchange', loadInvitation);
    addEventListener('resize', resizeLetter);
    reducedMotion.addEventListener('change', () => { if (reducedMotion.matches) document.querySelectorAll('.confetti').forEach(piece => piece.remove()); });
    loadInvitation();
  </script>
</body>
</html>
